<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Mobile Viewport & PWA Optimization Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0ea5e9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1e293b" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="manifest" href="manifest.json">

    <title>Admin Control - MoraSpace</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <style> 
        /* Mobile Touch & Scrollbar Optimizations */
        * { -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        body { font-family: 'Inter', sans-serif; } 
    </style>
</head>
<body class="text-gray-800 bg-[#f8fafc] dark:bg-gray-900 dark:text-gray-200 antialiased p-4 sm:p-6 min-h-screen transition-colors duration-200">

    <div class="max-w-3xl mx-auto relative pt-4">
        
        <!-- Header with Dark Mode Toggle -->
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-3">
                <div class="bg-slate-800 dark:bg-slate-700 p-2 rounded-lg transition-colors">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </div>
                <h1 class="text-xl sm:text-2xl font-bold text-gray-900 dark:text-white transition-colors">System Admin</h1>
            </div>

            <!-- Dark Mode Toggle Button -->
            <button onclick="toggleDarkMode()" class="p-2 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors focus:outline-none focus:ring-2 focus:ring-slate-500">
                <!-- Moon Icon -->
                <svg id="theme-toggle-dark-icon" class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <!-- Sun Icon -->
                <svg id="theme-toggle-light-icon" class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            </button>
        </div>

        <!-- Sensor Diagnostics -->
        <section class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 p-5 sm:p-6 mb-8 transition-colors">
            <h2 class="text-lg font-bold text-gray-900 dark:text-white mb-4 border-b border-gray-200 dark:border-gray-700 pb-2 transition-colors">Hardware Sensor Status</h2>
            <div id="sensor-status" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="text-sm text-gray-500 dark:text-gray-400">Checking sensor heartbeats...</div>
            </div>
        </section>

        <!-- Capacity Controls -->
        <section class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 p-5 sm:p-6 transition-colors">
            <h2 class="text-lg font-bold text-gray-900 dark:text-white mb-4 border-b border-gray-200 dark:border-gray-700 pb-2 transition-colors">Modify Area Capacity</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1 transition-colors">Admin API Key</label>
                    <input type="password" id="api-key" placeholder="Enter X-API-Key..." class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 dark:text-white rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500 transition-colors">
                </div>

                <div class="flex flex-col sm:flex-row gap-4">
                    <div class="w-full sm:w-1/2">
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1 transition-colors">Study Area</label>
                        <select id="area-select" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 dark:text-white rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500 transition-colors">
                            <option value="apaya">Apaya Area</option>
                            <option value="centra">Centra Area</option>
                        </select>
                    </div>
                    <div class="w-full sm:w-1/2">
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1 transition-colors">New Capacity limit</label>
                        <input type="number" id="new-capacity" placeholder="e.g. 60" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 dark:text-white rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500 transition-colors">
                    </div>
                </div>

                <button onclick="updateCapacity()" class="w-full sm:w-auto bg-slate-800 dark:bg-slate-700 text-white font-semibold px-6 py-2.5 rounded-lg hover:bg-slate-700 dark:hover:bg-slate-600 transition-colors mt-2">
                    Update Capacity
                </button>

                <div id="status-message" class="hidden mt-4 p-3 rounded-lg text-sm font-medium transition-colors"></div>
            </div>
        </section>
        
        <!-- Back to Dashboard Button -->
        <div class="mt-8 mb-12 flex justify-center">
             <a href="index.html" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-6 rounded-lg transition-colors shadow-sm w-full sm:w-auto justify-center">
                 <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                 Back to Dashboard
             </a>
        </div>
    </div>

    <script>
        const BASE_URL = 'https://smartstudy-backend-psi.vercel.app';

        function toggleDarkMode() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        async function checkSensors() {
            try {
                const response = await fetch(`${BASE_URL}/api/study-areas`);
                const data = await response.json();
                
                let html = '';
                for (const [area, info] of Object.entries(data)) {
                    const isOnline = info.power === true; 
                    const statusColor = isOnline 
                        ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-400' 
                        : 'bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-400';
                    const statusText = isOnline ? 'Online & Syncing' : 'Offline / Error';
                    
                    html += `
                        <div class="border border-gray-200 dark:border-gray-700 rounded-xl p-4 flex justify-between items-center bg-gray-50 dark:bg-gray-700/50 transition-colors">
                            <div>
                                <h3 class="font-bold text-gray-900 dark:text-white capitalize transition-colors">${area} Hardware</h3>
                                <p class="text-xs text-gray-500 dark:text-gray-400 mt-1 transition-colors">Current Capacity: ${info.capacity}</p>
                            </div>
                            <span class="px-3 py-1 rounded-full text-xs font-bold ${statusColor} transition-colors whitespace-nowrap ml-2">${statusText}</span>
                        </div>
                    `;
                }
                document.getElementById('sensor-status').innerHTML = html;
            } catch (err) {
                document.getElementById('sensor-status').innerHTML = '<span class="text-red-500 dark:text-red-400">Failed to connect to backend.</span>';
            }
        }

        async function updateCapacity() {
            const apiKey = document.getElementById('api-key').value;
            const area = document.getElementById('area-select').value;
            const capacity = document.getElementById('new-capacity').value;
            const msgBox = document.getElementById('status-message');

            if (!apiKey || !capacity) {
                msgBox.className = 'mt-4 p-3 rounded-lg text-sm font-medium bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-400 block transition-colors';
                msgBox.innerText = 'Please provide both the API Key and a new capacity.';
                return;
            }

            try {
                const response = await fetch(`${BASE_URL}/api/admin/capacity`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-API-Key': apiKey },
                    body: JSON.stringify({ area_id: area, capacity: parseInt(capacity) })
                });

                const result = await response.json();

                if (response.ok) {
                    msgBox.className = 'mt-4 p-3 rounded-lg text-sm font-medium bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-400 block transition-colors';
                    msgBox.innerText = 'Success: ' + result.message;
                    checkSensors(); 
                } else {
                    msgBox.className = 'mt-4 p-3 rounded-lg text-sm font-medium bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-400 block transition-colors';
                    msgBox.innerText = 'Error: ' + result.detail;
                }
            } catch (err) {
                msgBox.className = 'mt-4 p-3 rounded-lg text-sm font-medium bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-400 block transition-colors';
                msgBox.innerText = 'Network error occurred.';
            }
        }

        checkSensors();
    </script>
</body>
</html>
